<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="10" fill="#F8F5EC"/>
  <!-- Crescent moon -->
  <path d="M 23 7 C 12.5 7 4 15.5 4 26 C 4 36.5 12.5 45 23 45 C 27.5 45 31.6 43.4 34.8 40.8 C 24 39.5 17 31 17 24 C 17 17 24 8.5 34.8 7.2 C 31.6 8.6 27.5 7 23 7 Z" fill="#005A3E"/>
  <!-- Compass Star (Center at 26, 25) -->
  <g transform="translate(26, 25)">
    <!-- Ring -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#005A3E" stroke-width="1.2" opacity="0.85"/>
    <!-- Cardinal rays -->
    <polygon points="0,-15 2,-3 0,0 -2,-3" fill="#005A3E"/>
    <polygon points="0,15 2,3 0,0 -2,3" fill="#005A3E"/>
    <polygon points="-15,0 -3,-2 0,0 -3,2" fill="#005A3E"/>
    <polygon points="15,0 3,-2 0,0 3,2" fill="#005A3E"/>
    <!-- Diagonal rays -->
    <polygon points="9,-9 2,-1 0,0 1,-2" fill="#005A3E" opacity="0.9"/>
    <polygon points="9,9 1,2 0,0 2,1" fill="#005A3E" opacity="0.9"/>
    <polygon points="-9,-9 -1,-2 0,0 -2,-1" fill="#005A3E" opacity="0.9"/>
    <polygon points="-9,9 -2,1 0,0 -1,2" fill="#005A3E" opacity="0.9"/>
    <!-- Gold Center -->
    <circle cx="0" cy="0" r="2.4" fill="#C5A059" stroke="#005A3E" stroke-width="0.8"/>
  </g>
  <!-- Small Star at crescent opening -->
  <polygon points="39,21 40,24 43,24 40.5,26 41.5,29 39,27.2 36.5,29 37.5,26 35,24 38,24" fill="#005A3E"/>
</svg>
